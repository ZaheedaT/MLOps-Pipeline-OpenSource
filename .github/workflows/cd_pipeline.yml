name: MLOps CD

on:
  workflow_run:
    workflows: ["MLOps CI"]
    types:
      - completed

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:

    - name: Checkout successful CI commit
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.workflow_run.head_sha }}

    - name: Check GitHub OIDC environment
      run: |
        echo "Repository: ${{ github.repository }}"
        echo "Ref: ${{ github.ref }}"
        echo "SHA: ${{ github.sha }}"
        echo "Event: ${{ github.event_name }}"
        

    - name: Check GitHub context
      run: |
        echo "Repository: ${{ github.repository }}"
        echo "Ref: ${{ github.ref }}"
        echo "SHA: ${{ github.sha }}"
        echo "Event: ${{ github.event_name }}"
        echo "Workflow run branch: ${{ github.event.workflow_run.head_branch }}"
        echo "Workflow run SHA: ${{ github.event.workflow_run.head_sha }}"


    - name: Inspect OIDC claims
      shell: bash
      run: |
        TOKEN=$(curl -sS \
          -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
          | jq -r '.value')

        python - "$TOKEN" <<'PY'
        import sys
        import json
        import base64

        token = sys.argv[1]
        payload = token.split('.')[1]
        payload += '=' * (-len(payload) % 4)

        claims = json.loads(
            base64.urlsafe_b64decode(payload)
        )

        print("OIDC claims:")
        print("iss:", claims.get("iss"))
        print("aud:", claims.get("aud"))
        print("sub:", claims.get("sub"))
        print("ref:", claims.get("ref"))
        print("repository:", claims.get("repository"))
        print("repository_id:", claims.get("repository_id"))
        print("repository_owner:", claims.get("repository_owner"))
        print("repository_owner_id:", claims.get("repository_owner_id"))
        print("workflow:", claims.get("workflow"))
        print("event_name:", claims.get("event_name"))
        print("job_workflow_ref:", claims.get("job_workflow_ref"))
        PY


    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ vars.AWS_ROLE_ARN }}
        aws-region: ${{ vars.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2


- name: Install BentoML
  run: |
    pip install bentoml==1.4.39

- name: Download BentoML model
  uses: actions/download-artifact@v5
  with:
    name: house-price-model
    path: .
    run-id: ${{ github.event.workflow_run.id }}
    github-token: ${{ secrets.GITHUB_TOKEN }}

- name: Import BentoML model
  run: |
    bentoml models import ./house_price_model.bentomodel

- name: Build Bento
  run: |
    bentoml build serving/bentofile.yaml

- name: Get Bento tag
  id: bento
  run: |
    BENTO_TAG=$(bentoml list house_service --output json | python -c "import sys,json; data=json.load(sys.stdin); print(data[0]['tag'])")
    echo "tag=$BENTO_TAG" >> "$GITHUB_OUTPUT"
    echo "Bento tag: $BENTO_TAG"

- name: Containerize Bento
  run: |
    bentoml containerize "${{ steps.bento.outputs.tag }}"

- name: Get Bento tag
  id: bento
  run: |
    BENTO_TAG=$(bentoml list house_service --output json | python -c "import sys,json; data=json.load(sys.stdin); print(data[0]['tag'])")
    echo "tag=$BENTO_TAG" >> "$GITHUB_OUTPUT"
    echo "Bento tag: $BENTO_TAG"


- name: Containerize Bento
  run: |
    bentoml containerize house_service:latest

- name: Tag BentoML Docker image
  run: |
    docker tag \
      house_service:latest \
      ${{ steps.login-ecr.outputs.registry }}/house-price-model:${{ github.sha }}

- name: Push Docker image
  run: |
    docker push \
      ${{ steps.login-ecr.outputs.registry }}/house-price-model:${{ github.sha }}