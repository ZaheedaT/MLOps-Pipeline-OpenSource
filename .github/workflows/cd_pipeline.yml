name: MLOps CD

on:
  workflow_run:
    workflows: ["MLOps CI"]
    types:
      - completed

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:

    - name: Checkout successful CI commit
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.workflow_run.head_sha }}

    - name: Check GitHub OIDC environment
      run: |
        echo "Repository: ${{ github.repository }}"
        echo "Ref: ${{ github.ref }}"
        echo "SHA: ${{ github.sha }}"
        echo "Event: ${{ github.event_name }}"
        

    - name: Check GitHub context
      run: |
        echo "Repository: ${{ github.repository }}"
        echo "Ref: ${{ github.ref }}"
        echo "SHA: ${{ github.sha }}"
        echo "Event: ${{ github.event_name }}"
        echo "Workflow run branch: ${{ github.event.workflow_run.head_branch }}"
        echo "Workflow run SHA: ${{ github.event.workflow_run.head_sha }}"


    - name: Inspect OIDC claims
      shell: bash
      run: |
        TOKEN=$(curl -sS \
          -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
          | jq -r '.value')

        python - "$TOKEN" <<'PY'
        import sys
        import json
        import base64

        token = sys.argv[1]
        payload = token.split('.')[1]
        payload += '=' * (-len(payload) % 4)

        claims = json.loads(
            base64.urlsafe_b64decode(payload)
        )

        print("OIDC claims:")
        print("iss:", claims.get("iss"))
        print("aud:", claims.get("aud"))
        print("sub:", claims.get("sub"))
        print("ref:", claims.get("ref"))
        print("repository:", claims.get("repository"))
        print("repository_id:", claims.get("repository_id"))
        print("repository_owner:", claims.get("repository_owner"))
        print("repository_owner_id:", claims.get("repository_owner_id"))
        print("workflow:", claims.get("workflow"))
        print("event_name:", claims.get("event_name"))
        print("job_workflow_ref:", claims.get("job_workflow_ref"))
        PY


    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ vars.AWS_ROLE_ARN }}
        aws-region: ${{ vars.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2


    - name: Install BentoML
      run: |
        pip install bentoml==1.4.39 pandas scikit-learn

    - name: Download BentoML model
      uses: actions/download-artifact@v5
      with:
        name: house-price-model
        path: .
        run-id: ${{ github.event.workflow_run.id }}
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Import BentoML model
      run: |
        bentoml models import ${{ github.workspace }}/house_price_model.bentomodel


    - name: Build Bento and Extract Exact Tag
      run: |
        # 1. Build and force BentoML to return only the raw string of the exact version tag
        EXACT_TAG=$(bentoml build serving/ --output tag)
        
        # 2. Save this exact string directly to the runner environment
        echo "BENTO_VERSION=$EXACT_TAG" >> "$GITHUB_ENV"
        echo "Targeting exact version tag: $EXACT_TAG"

    - name: Containerize Exact Bento Version
      run: |
        # 3. Use the exact dynamic tag instead of an empty workflow id string
        bentoml containerize "$BENTO_VERSION"

    - name: Tag BentoML Docker image
      run: |
        # 4. Reference the exact versioned local container image instead of generic ":latest"
        docker tag \
          "$BENTO_VERSION" \
          ${{ steps.login-ecr.outputs.registry }}/house-price-model:${{ github.sha }}

    - name: Push Docker image
      run: |
        docker push \
          ${{ steps.login-ecr.outputs.registry }}/house-price-model:${{ github.sha }}
