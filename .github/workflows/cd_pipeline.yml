name: MLOps CD

on:
  workflow_run:
    workflows: ["MLOps CI"]
    types:
      - completed

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:

    - name: Checkout successful CI commit
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.workflow_run.head_sha }}

    - name: Check GitHub OIDC environment
      run: |
        echo "Repository: ${{ github.repository }}"
        echo "Ref: ${{ github.ref }}"
        echo "SHA: ${{ github.sha }}"
        echo "Event: ${{ github.event_name }}"

    - name: Debug OIDC claims
      uses: github/actions-oidc-debugger@main

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ vars.AWS_ROLE_ARN }}
        aws-region: ${{ vars.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2


    - name: Inspect Docker build context
      run: |
        echo "Current directory:"
        pwd
        
        echo ""
        echo "Files:"
        ls -la
        
        echo ""
        echo "Dockerfiles:"
        find . -name "Dockerfile" -o -name "*.dockerfile"
        
        echo ""
        echo ".go-version:"
        if [ -f .go-version ]; then
          cat .go-version
        else
          echo ".go-version NOT FOUND"
        fi

    - name: Build Docker image
      run: |
        docker build -t house-price-model:${{ github.sha }} .

    - name: Tag Docker image
      run: |
        docker tag \
          house-price-model:${{ github.sha }} \
          ${{ steps.login-ecr.outputs.registry }}/house-price-model:${{ github.sha }}

    - name: Push Docker image
      run: |
        docker push \
          ${{ steps.login-ecr.outputs.registry }}/house-price-model:${{ github.sha }}
