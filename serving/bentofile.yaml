service: "service:HouseService"
include:
  - "serving/service.py"
  - "*.py"
name: house_service
labels:
    owner: zahee
    stage: dev
# Move packages under the 'python' block
python:
  packages:
    - bentoml==1.4.39
    - mlflow==3.15.1
    - pandas==2.3.3
    - numpy==1.26.4
    - scikit-learn==1.3.2
    - scipy==1.15.3
    - jaraco-text==4.0.0
    - pytest==9.1.1

# Move python_version under the 'docker' block
docker:
  python_version: '3.10'

models:
  - "house_price_model:latest"
  - tag: "house_price_model:latest"
    alias: "house_alias"